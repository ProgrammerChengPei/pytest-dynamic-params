# Conversation State Management
# This file tracks all Tasks, Topics, and QAs with their unique IDs and states

tasks:
  # Example Task:
  # - id: T-20260326192600-a1b2
  #   name: "任务名称"
  #   status: IDLE  # IDLE | ACTIVE | PAUSED | COMPLETED | ABANDONED
  #   created_at: 2026-03-26T19:26:00
  #   updated_at: 2026-03-26T19:26:00
  #   topics:
  #     - id: TP-T-20260326192600-a1b2-001
  #       name: "话题名称"
  #       status: ACTIVE  # ACTIVE | PAUSED | COMPLETED | ABANDONED
  #       created_at: 2026-03-26T19:26:00
  #       updated_at: 2026-03-26T19:26:00
  #       qas:
  #         - id: QA-TP-T-20260326192600-a1b2-001-001
  #           user_input: "用户输入内容"
  #           ai_response: "AI 回答内容"
  #           status: COMPLETED  # PROCESSING | WAITING | COMPLETED | INTERRUPTED
  #           created_at: 2026-03-26T19:26:00
  #           updated_at: 2026-03-26T19:26:00

# Current active task reference
active_task_id: null

# Project-level memory (user preferences, project background, etc.)
project_memory:
  # Example:
  # - key: "coding_style"
  #   value: "遵循 PEP8 规范，使用 Black 格式化"
  # - key: "project_background"
  #   value: "这是一个动态参数生成项目"
