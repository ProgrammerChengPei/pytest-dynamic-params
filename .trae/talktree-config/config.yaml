# ⚠️ TalkTree 配置文件
# 
# AI 注意：这是 TalkTree 系统的主配置文件！
# 
# 位置说明：
# - 本文件位于：{AI_ROOT}/talktree-config/config.yaml
# - {AI_ROOT} 是当前 AI 的根目录（如 .trae/、.codebuddy/ 等）
# - 实际使用时，{AI_ROOT} 替换为对应的目录名
#
# 相关文档：
# - 配置指南：{AI_ROOT}/talktree-config/CONFIG_GUIDE.md
# - 项目结构：{AI_ROOT}/talktree-project.md
# - 系统总览：{AI_ROOT}/talktree-README.md
#
# ====================
# 存储设置
# ====================
storage_path: "{AI_ROOT}/talktree-conversations"   # 存储根路径
use_relative_path: true           # 使用相对路径
file_encoding: "utf-8"            # 文件编码
json_indent: 2                    # JSON 缩进空格数
auto_save_interval: 900           # 自动保存间隔（秒，900=15 分钟）
auto_save_enabled: true           # 启用自动保存
generate_history_markdown: true   # 生成 Markdown 历史记录
history_markdown_interval: 600    # 生成 Markdown 历史记录间隔（秒）

# ====================
# ID 生成设置
# ====================
use_short_id: false               # 使用短 ID（8 字符）而非完整 UUID

id_prefixes:
  conversation: "conv_"           # 对话 ID 前缀
  topic: "topic_"                 # 话题 ID 前缀
  qa_pair: "qa_"                  # 问答对 ID 前缀
  snapshot: "snap_"               # 快照 ID 前缀

# ====================
# 记忆管理设置
# ====================
memory_inheritance_strategy: "default"  # 记忆继承策略：default, all, selective, none
short_term_memory_turns: 10            # 短期记忆保留轮数
long_term_memory_enabled: true         # 启用长期记忆

# ====================
# 性能设置
# ====================
context_window_size: 10           # 上下文窗口大小（轮数）
context_compression_enabled: true # 启用上下文压缩
context_compression_threshold: 20 # 压缩阈值（轮数）

# ====================
# 显示设置
# ====================
show_ids_in_response: true        # 在响应中显示 ID
show_timestamps: false            # 在响应中显示时间戳
show_save_notifications: true     # 显示保存通知
default_history_limit: 10         # 默认历史记录限制（轮数）

# ====================
# 日志设置
# ====================
log_level: "INFO"                 # 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file_path: "{AI_ROOT}/logs/TalkTree.log"  # 日志文件路径
log_rotation_enabled: true        # 启用日志轮转
log_max_size_mb: 10               # 日志文件最大大小（MB）
log_backup_count: 5               # 备份日志文件数量

# ====================
# 高级设置（可选）
# ====================

# 数据库配置（如果使用数据库存储）
# database:
#   enabled: false
#   type: "sqlite"  # sqlite, postgresql, mysql
#   connection_string: "sqlite:///{AI_ROOT}/talktree-conversations/TalkTree.db"

# 缓存配置
cache:
  enabled: true
  type: "memory"  # memory, redis
  expire_seconds: 3600  # 缓存过期时间（秒，0=永不过期）
  # redis:
  #   host: "localhost"
  #   port: 6379
  #   db: 0

# 安全设置
security:
  enable_sensitive_word_filter: true
  sensitive_words_file: "./talktree-config/sensitive_words.txt"
  enable_input_length_limit: true
  max_input_length: 10000
  enable_rate_limit: false
  max_requests_per_minute: 60
